<aside class="surface panel" [attr.aria-label]="usuario() ? 'Editar usuario' : 'Nuevo usuario'">
  <div class="panel-head">
    <h2>{{ usuario() ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
    <button type="button" class="btn btn-ghost btn-sm btn-icon" (click)="cerrado.emit()" aria-label="Cerrar formulario"><app-icon name="x" [size]="18" /></button>
  </div>
  <form (submit)="guardar($event)" novalidate class="form">
    <div class="field">
      <label for="n">Nombre completo</label>
      <input id="n" class="input" autocomplete="off" [value]="nombre()" (input)="nombre.set($any($event.target).value)" />
    </div>
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" class="input" autocomplete="off" autocapitalize="none" [readOnly]="!!usuario()" [value]="username()" (input)="username.set($any($event.target).value)" />
    </div>
    <div class="field">
      <label for="e">Correo</label>
      <input id="e" class="input" type="email" autocomplete="off" placeholder="nombre@empresa.co" [value]="email()" (input)="email.set($any($event.target).value)" />
    </div>
    <fieldset class="field">
      <legend class="label">Roles</legend>
      @for (r of roles; track r.id) {
        <label class="check">
          <input type="checkbox" [checked]="sel().includes(r.id)" (change)="alternar(r.id)" />
          <span><strong>{{ r.etiqueta }}</strong> <small class="muted">{{ r.detalle }}</small></span>
        </label>
      }
    </fieldset>
    @if (usuario()) {
      <label class="check">
        <input type="checkbox" [checked]="activo()" (change)="activo.set(!activo())" />
        <span><strong>Usuario activo</strong></span>
      </label>
    }
    @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
    <div class="fila">
      <button type="submit" class="btn btn-primary">{{ usuario() ? 'Guardar cambios' : 'Crear usuario' }}</button>
      <button type="button" class="btn btn-secondary" (click)="cerrado.emit()">Cancelar</button>
    </div>
  </form>
</aside>
