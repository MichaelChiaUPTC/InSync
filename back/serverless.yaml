org: maikolkolchia

service: gestion-api

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  timeout: 25   # listar usuarios hace varias llamadas a Keycloak a traves del tunel (por defecto Lambda corta a los 6 s)
  # Estos valores son de cada maquina: van en back/.env (no se sube a git; plantilla en back/env.ejemplo)
  environment:
    KEYCLOAK_URL: ${env:KEYCLOAK_URL}
    KEYCLOAK_CLIENT_ID: ${env:KEYCLOAK_CLIENT_ID, 'Beta0'}
    KEYCLOAK_CLIENT_SECRET_A: ${env:KEYCLOAK_CLIENT_SECRET_A}
    KEYCLOAK_CLIENT_SECRET_B: ${env:KEYCLOAK_CLIENT_SECRET_B}
    # Vacio = Kafka desactivado. Ej: "54.12.34.56:9092"
    KAFKA_BOOTSTRAP_SERVERS: ${env:KAFKA_BOOTSTRAP_SERVERS, ''}
    # URL publica (tunel ngrok) del Kafka REST Proxy; vacio = no se usa
    KAFKA_REST_URL: ${env:KAFKA_REST_URL, ''}

functions:
  app:
    handler: wsgi_handler.handler
    events:

      # =========================
      # TENANT A - LOGIN
      # =========================

      - http:
          path: tenantA/login
          method: post
          cors: true


      # =========================
      # TENANT A - USUARIOS
      # =========================

      - http:
          path: tenantA/usuarios
          method: get
          cors: true

      - http:
          path: tenantA/usuarios
          method: post
          cors: true

      - http:
          path: tenantA/usuarios/{id}
          method: put
          cors: true

      - http:
          path: tenantA/usuarios/{id}
          method: delete
          cors: true


      # =========================
      # TENANT A - PRODUCTOS
      # =========================

      - http:
          path: tenantA/productos
          method: get
          cors: true

      - http:
          path: tenantA/productos
          method: post
          cors: true

      - http:
          path: tenantA/productos/{id}
          method: put
          cors: true

      - http:
          path: tenantA/productos/{id}
          method: delete
          cors: true


      # =========================
      # TENANT A - VENTAS
      # =========================

      - http:
          path: tenantA/ventas
          method: get
          cors: true

      - http:
          path: tenantA/ventas
          method: post
          cors: true

      - http:
          path: tenantA/ventas/{id}
          method: put
          cors: true

      - http:
          path: tenantA/ventas/{id}
          method: delete
          cors: true


      # =========================
      # TENANT B - LOGIN
      # =========================

      - http:
          path: tenantB/login
          method: post
          cors: true


      # =========================
      # TENANT B - USUARIOS
      # =========================

      - http:
          path: tenantB/usuarios
          method: get
          cors: true

      - http:
          path: tenantB/usuarios
          method: post
          cors: true

      - http:
          path: tenantB/usuarios/{id}
          method: put
          cors: true

      - http:
          path: tenantB/usuarios/{id}
          method: delete
          cors: true


      # =========================
      # TENANT B - PRODUCTOS
      # =========================

      - http:
          path: tenantB/productos
          method: get
          cors: true

      - http:
          path: tenantB/productos
          method: post
          cors: true

      - http:
          path: tenantB/productos/{id}
          method: put
          cors: true

      - http:
          path: tenantB/productos/{id}
          method: delete
          cors: true


      # =========================
      # TENANT B - VENTAS
      # =========================

      - http:
          path: tenantB/ventas
          method: get
          cors: true

      - http:
          path: tenantB/ventas
          method: post
          cors: true

      - http:
          path: tenantB/ventas/{id}
          method: put
          cors: true

      - http:
          path: tenantB/ventas/{id}
          method: delete
          cors: true


plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: app.app
