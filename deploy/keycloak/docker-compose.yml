# Maquina 1: Keycloak + Postgres + Caddy (HTTPS automatico con Let's Encrypt)
# Uso: cp .env.example .env  ->  editar  ->  docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD:-admin}
      KC_HOSTNAME: https://${KC_DOMAIN:?define KC_DOMAIN}
      KC_HTTP_ENABLED: "true"          # TLS lo termina Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${KC_DOMAIN:?define KC_DOMAIN} --to keycloak:8080
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
